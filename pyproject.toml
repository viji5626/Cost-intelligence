[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hero-cost-intelligence"
version = "0.1.0"
description = "Hero MotoCorp Vehicle Cost & Plant OPEX Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "psutil>=5.9.8",
    "openpyxl>=3.1.2",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.20.0",
    "black>=24.2.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.pyrefly]
project-includes = [
    "ai/**/*.py",
    "apps/**/*.py",
    "core/**/*.py",
    "database/**/*.py",
    "models/**/*.py",
    "services/**/*.py",
    "scripts/**/*.py",
    "tests/**/*.py",
]
project-excludes = [
    "**/.venv/**",
    "**/venv/**",
    "**/node_modules/**",
    "**/build/**",
    "**/dist/**",
    "**/.git/**",
    "**/.system_generated/**",
    "**/.pytest_cache/**",
    "**/*.gguf",
    "**/*.bin",
    "**/*.onnx",
    "**/scratch/**",
    "**/__pycache__/**",
]
python-version = "3.11"
python-platform = "win32"
use-ignore-files = true
check-unannotated-defs = false
